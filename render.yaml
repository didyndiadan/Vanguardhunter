services:
  - type: web
    name: vanguard-hunter
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vanguard-hunter-db
          property: connectionString

databases:
  - name: vanguard-hunter-db
    plan: free
    databaseName: vanguard_hunter
    user: vanguard_user
